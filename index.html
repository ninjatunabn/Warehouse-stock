<style>
:root{--bg:#F2F5F7;--surface:#FFF;--surface-2:#F6F8F9;--ink:#14202B;--muted:#5A6A78;--line:#DCE3E8;--accent:#0B6E6E;--accent-ink:#FFF;--accent-soft:#DDF0EF;--ok:#1E7B4F;--ok-soft:#DFF2E7;--warn:#995A00;--warn-soft:#FBEBCB;--crit:#B3261E;--crit-soft:#FADDDA;--font:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1418;--surface:#162027;--surface-2:#1B2830;--ink:#E6EDF2;--muted:#93A4B1;--line:#27363F;--accent:#4FC3C3;--accent-ink:#06262A;--accent-soft:#17383B;--ok:#5CC48E;--ok-soft:#173326;--warn:#E5A94A;--warn-soft:#3A2D12;--crit:#F27B72;--crit-soft:#3C1B19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1418;--surface:#162027;--surface-2:#1B2830;--ink:#E6EDF2;--muted:#93A4B1;--line:#27363F;--accent:#4FC3C3;--accent-ink:#06262A;--accent-soft:#17383B;--ok:#5CC48E;--ok-soft:#173326;--warn:#E5A94A;--warn-soft:#3A2D12;--crit:#F27B72;--crit-soft:#3C1B19;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}h1,h2,h3,p{margin:0}[hidden]{display:none!important}.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}.muted{color:var(--muted)}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}.top .wrap{padding-block:12px 0}.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}.brand h1{font-size:20px;font-weight:700}.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;color:var(--muted);font-size:13px}.live{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}.live.on{color:var(--ok)}.live.on:before{background:var(--ok)}.live.off{color:var(--crit)}.live.off:before{background:var(--crit)}.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}.tab{font:inherit;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap}.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}main{padding-block:16px 96px;display:flex;flex-direction:column;gap:16px}
.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}.btn:hover{background:var(--surface-2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.08)}.btn.sm{padding:4px 10px;font-size:13px}.btn.danger{color:var(--crit)}.btn[disabled]{opacity:.5;cursor:not-allowed}.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr[data-action]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}textarea{width:100%;resize:vertical}label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 14px;border-bottom:1px solid var(--line)}.panel-h h2{font-size:15px;font-weight:700}.panel-b{padding:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}.stat{background:var(--surface);padding:12px 14px}.stat .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.stat .v{font:500 26px/1.2 var(--mono);margin-top:2px}.stat .s{font-size:12px;color:var(--muted);margin-top:2px}.stat .v.warn{color:var(--warn)}.stat .v.crit{color:var(--crit)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}th.num,td.num{text-align:right}td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}td.pname{font-weight:600;min-width:170px}tr[data-action]{cursor:pointer}tr.sel td{background:var(--surface-2)}.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.out{background:var(--crit-soft);color:var(--crit)}.pill.none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.filters input[type=search]{width:min(240px,100%)}
.chartwrap{padding:10px 14px 14px}.chart{width:100%;height:auto;display:block}.chart .grid{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--muted);font:11px var(--mono)}.chart .bar{fill:var(--accent)}.chart .bar:hover{filter:brightness(1.08)}.chart .val{fill:var(--ink);font:11px var(--mono)}
.monthbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}.monthbar strong{font-size:14px}.legend{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:12px}.legend i{display:inline-block;width:12px;height:6px;background:var(--accent);border-radius:2px;margin-right:5px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}.seg .btn{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 10px;font-size:12px}.seg .btn:last-child{border-right:0}.seg .btn.active{background:var(--accent-soft);color:var(--ink);font-weight:700}
.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}.formgrid .wide{grid-column:span 2}.formgrid .full{grid-column:1/-1}.product-form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;align-items:end}.product-form .wide{grid-column:span 2}.product-form textarea{min-height:76px}.usage-form{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;align-items:end}.balance{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-family:var(--mono)}.balance strong{display:block;font-size:20px;color:var(--ink)}.balance span{font:12px var(--font);color:var(--muted)}.note{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:500}.empty{padding:36px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}.empty h2{font-size:18px}.empty p{max-width:58ch;color:var(--muted)}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}.err{color:var(--crit);font-weight:600}.help{font-size:12px;color:var(--muted);margin-top:8px}.drop{border:1px dashed var(--line);border-radius:8px;padding:14px;background:var(--surface-2)}.import-preview{max-height:280px;overflow:auto;margin-top:10px}.rowedit{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.desc{max-width:260px;color:var(--muted);font-size:12px}.loginwrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}.login{width:min(380px,100%);padding:24px;display:flex;flex-direction:column;gap:14px}.login h1{font-size:20px}
@media(max-width:860px){.product-form{grid-template-columns:1fr 1fr}.product-form .wide{grid-column:1/-1}.usage-form{grid-template-columns:1fr 1fr}.usage-form .balance{grid-column:1/-1}.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.formgrid,.product-form,.usage-form{grid-template-columns:1fr}.formgrid .wide,.product-form .wide{grid-column:auto}.rowedit{grid-template-columns:1fr}.filters input[type=search]{width:100%}}
</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var $app=document.getElementById('app'),cfg=window.STOCK_CONFIG||{},sb=null,nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:3});
var S={uid:null,me:null,isAdmin:false,authChecked:false,ready:false,loading:false,loadErr:'',loginErr:'',authBusy:false,live:false,tab:'dash',usageView:'monthly',products:[],usage:[],names:{},sel:null,f:{},busy:false,msg:'',usageBusy:false,usageErr:'',importRows:[],importErr:''};
var channel=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(n){return nf.format(Number(n)||0)}
function parseQty(v){var t=String(v==null?'':v).trim().replace(',','.');if(!/^\d+(\.\d+)?$/.test(t))return NaN;var n=Number(t);return isFinite(n)&&n>=0?n:NaN}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function monthLabel(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,1).toLocaleDateString('en-US',{month:'short'})}
function longMonth(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}
function nameOf(id){return id===S.uid?'You':S.names[id]||'a teammate'}
function active(){return S.products.filter(function(p){return p.active!==false}).sort(function(a,b){return a.name.localeCompare(b.name)})}
function configured(){return !!(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&!/YOUR-/.test(cfg.SUPABASE_URL+cfg.SUPABASE_ANON_KEY))}
function errText(e){var c=e&&e.code,m=e&&e.message||'';if(c==='42501'||/row-level security|permission denied/i.test(m))return 'You do not have permission to do this.';if(c==='23505')return 'A product with this name already exists.';if(c==='P0001')return m.replace(/^.*?:\s*/,'');if(/failed to fetch|network/i.test(m))return 'No connection. Check the internet and try again.';return m||'Something went wrong.'}
function toast(m){S.msg=m;render();clearTimeout(toast.t);toast.t=setTimeout(function(){S.msg='';render()},3000)}
function mapProduct(r){return{id:r.id,name:r.name,unit:r.unit||'',remaining:Number(r.remaining_balance)||0,brand:r.brand||'',description:r.description||'',active:r.active!==false}}
async function loadData(){
  var p=await sb.from('products').select('id,name,unit,remaining_balance,brand,description,active').order('name');if(p.error)throw p.error;S.products=p.data.map(mapProduct);
  var prof=await sb.from('profiles').select('id,full_name,role');if(prof.error)throw prof.error;prof.data.forEach(function(x){S.names[x.id]=x.full_name||'a teammate';if(x.id===S.uid){S.me=x;S.isAdmin=x.role==='admin'}});
  var d=new Date();d.setMonth(d.getMonth()-11);d.setDate(1);var u=await sb.from('usage_transactions').select('id,product_id,quantity,used_at,entered_by,created_at').gte('used_at',d.toISOString()).order('used_at',{ascending:false}).limit(5000);if(u.error)throw u.error;S.usage=u.data;
  if(!S.sel||!S.products.some(function(x){return x.id===S.sel&&x.active!==false}))S.sel=active()[0]&&active()[0].id||null;
}
function subscribe(){if(channel){try{sb.removeChannel(channel)}catch(e){}}channel=sb.channel('warehouse-stock-board').on('postgres_changes',{event:'*',schema:'public',table:'products'},function(){loadData().then(render).catch(function(){})}).on('postgres_changes',{event:'*',schema:'public',table:'usage_transactions'},function(){loadData().then(render).catch(function(){})}).subscribe(function(st){S.live=st==='SUBSCRIBED';render()})}
function teardown(){if(channel){try{sb.removeChannel(channel)}catch(e){}channel=null}S.uid=null;S.me=null;S.isAdmin=false;S.ready=false;S.products=[];S.usage=[];S.names={};S.sel=null;S.importRows=[]}
function monthlyUsage(pid){var now=new Date(),out=[];for(var i=11;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1),k=monthKey(d),q=0;S.usage.forEach(function(u){if(u.product_id===pid&&monthKey(new Date(u.used_at))===k)q+=Number(u.quantity)||0});out.push({key:k,label:monthLabel(k),qty:q})}return out}
function dailyUsage(pid){var now=new Date(),out=[];now.setHours(0,0,0,0);for(var i=29;i>=0;i--){var d=new Date(now);d.setDate(now.getDate()-i);var k=ymd(d),q=0;S.usage.forEach(function(u){var x=new Date(u.used_at);if(u.product_id===pid&&ymd(x)===k)q+=Number(u.quantity)||0});out.push({key:k,label:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),qty:q})}return out}
function usageThisMonth(pid){var k=monthKey(new Date());return S.usage.filter(function(u){return u.product_id===pid&&monthKey(new Date(u.used_at))===k}).reduce(function(a,u){return a+(Number(u.quantity)||0)},0)}
function usageThisDay(pid){var k=ymd(new Date());return S.usage.filter(function(u){return u.product_id===pid&&ymd(new Date(u.used_at))===k}).reduce(function(a,u){return a+(Number(u.quantity)||0)},0)}
function usageChart(pid){if(!pid)return '<p class="muted" style="padding:20px 0">Select a product to see usage.</p>';var p=S.products.find(function(x){return x.id===pid}),daily=S.usageView==='daily',data=daily?dailyUsage(pid):monthlyUsage(pid),mx=Math.max.apply(null,data.map(function(x){return x.qty}));mx=mx||1;var W=820,H=270,L=44,R=16,T=28,B=46,gap=daily?3:10,bw=(W-L-R-gap*(data.length-1))/data.length,o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(daily?'Daily':'Monthly')+' usage for '+esc(p?p.name:'product')+'">';[0,.5,1].forEach(function(f){var y=T+(1-f)*(H-T-B);o+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+num(mx*f)+'</text>'});data.forEach(function(x,i){var bh=(x.qty/mx)*(H-T-B),x0=L+i*(bw+gap),y=H-B-bh;o+='<rect class="bar" x="'+x0.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,bh).toFixed(1)+'" rx="3"><title>'+x.label+': '+num(x.qty)+' '+esc(p&&p.unit||'')+'</title></rect>';if(!daily||i%5===0||i===data.length-1)o+='<text class="ax" x="'+(x0+bw/2).toFixed(1)+'" y="'+(H-20)+'" text-anchor="middle">'+esc(x.label)+'</text>';if(x.qty>0&&!daily)o+='<text class="val" x="'+(x0+bw/2).toFixed(1)+'" y="'+Math.max(16,y-6)+'" text-anchor="middle">'+num(x.qty)+'</text>'});o+='</svg>';return o}
function viewDash(){var P=active();if(!P.length)return '<div class="panel empty"><h2>No products yet</h2><p>Add your warehouse products first. Product name, unit and remaining balance are required.</p>'+(S.isAdmin?'<button class="btn primary" data-action="tab" data-v="products">Add products</button>':'<p>Ask an administrator to add the product list.</p>')+'</div>';var out=P.filter(function(p){return p.remaining<=0}).length,total= S.usage.filter(function(u){return monthKey(new Date(u.used_at))===monthKey(new Date())}).reduce(function(a,u){return a+Number(u.quantity)||0},0),sel=P.find(function(p){return p.id===S.sel})||P[0];S.sel=sel.id;var q=(S.f.search||'').trim().toLowerCase(),list=P.filter(function(p){return !q||[p.name,p.brand,p.unit].join(' ').toLowerCase().indexOf(q)>=0});
var h='<section class="stats"><div class="stat"><div class="k">Products</div><div class="v">'+P.length+'</div><div class="s">active warehouse products</div></div><div class="stat"><div class="k">Out of stock</div><div class="v '+(out?'crit':'')+'">'+out+'</div><div class="s">remaining balance is zero</div></div><div class="stat"><div class="k">Used this month</div><div class="v">'+num(total)+'</div><div class="s">all products combined</div></div><div class="stat"><div class="k">Selected balance</div><div class="v">'+num(sel.remaining)+'</div><div class="s">'+esc(sel.unit)+' · '+esc(sel.name)+'</div></div></section>';
var usageTitle=S.usageView==='daily'?'Daily usage':'Monthly usage',usageTotal=S.usageView==='daily'?usageThisDay(sel.id):usageThisMonth(sel.id),usagePeriod=S.usageView==='daily'?'today':'this month';h+='<section class="panel"><div class="panel-h"><div><h2>'+usageTitle+'</h2><div class="muted">'+esc(sel.name)+(sel.brand?' · '+esc(sel.brand):'')+'</div></div><div class="legend"><div class="seg"><button class="btn '+(S.usageView==='monthly'?'active':'')+'" data-action="usage-view" data-v="monthly">Monthly</button><button class="btn '+(S.usageView==='daily'?'active':'')+'" data-action="usage-view" data-v="daily">Daily</button></div><span><i></i>Used</span><span class="mono">'+num(usageTotal)+' '+esc(sel.unit)+' '+usagePeriod+'</span></div></div><div class="chartwrap">'+usageChart(sel.id)+'</div></section>';
h+='<section class="panel"><div class="panel-h"><h2>Warehouse stock</h2><div class="filters"><input type="search" data-bind="search" placeholder="Search products" value="'+esc(S.f.search||'')+'"><button class="btn sm" data-action="export">Download CSV</button></div></div><div class="tw"><table style="min-width:760px"><thead><tr><th>Product</th><th>Brand</th><th>Unit</th><th class="num">Remaining</th><th class="num">This month</th><th>Status</th></tr></thead><tbody>';
list.forEach(function(p){var status=p.remaining<=0?'<span class="pill out">Out</span>':'<span class="pill ok">In stock</span>';h+='<tr data-action="select" data-pid="'+esc(p.id)+'" tabindex="0" class="'+(p.id===S.sel?'sel':'')+'"><td class="pname">'+esc(p.name)+(p.description?'<small>'+esc(p.description)+'</small>':'')+'</td><td>'+esc(p.brand||'–')+'</td><td>'+esc(p.unit)+'</td><td class="num">'+num(p.remaining)+'</td><td class="num">'+num(usageThisMonth(p.id))+'</td><td>'+status+'</td></tr>'});if(!list.length)h+='<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">No products match the search.</td></tr>';h+='</tbody></table></div></section>';return h}
function viewUsage(){var P=active();if(!P.length)return '<div class="panel empty"><h2>No products yet</h2><p>Add products before recording warehouse usage.</p></div>';var p=P.find(function(x){return x.id===S.sel})||P[0];S.sel=p.id;var rows=S.usage.filter(function(u){return u.product_id===p.id}).slice(0,30);var h='<section class="panel"><div class="panel-h"><div><h2>Record stock usage</h2><div class="muted">When a product leaves the warehouse, enter the amount here. The amount is automatically subtracted from the remaining balance.</div></div></div><div class="panel-b"><form id="form-usage" class="usage-form"><label>Product<select id="u-product" data-bind="u_product">'+P.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.name)+' — '+num(x.remaining)+' '+esc(x.unit)+'</option>'}).join('')+'</select></label><label>Amount taken<input id="u-qty" data-bind="u_qty" inputmode="decimal" placeholder="0" required></label><div class="balance">Remaining after save<strong>'+num(p.remaining)+' '+esc(p.unit)+'</strong><span>Current balance</span></div><button class="btn primary" type="submit"'+(S.usageBusy?' disabled':'')+'>'+(S.usageBusy?'Saving…':'Record usage')+'</button></form>'+(S.usageErr?'<div class="err" style="margin-top:10px">'+esc(S.usageErr)+'</div>':'')+'</div></section>';
h+='<section class="panel"><div class="panel-h"><h2>Usage history</h2><span class="muted">Latest 30 entries</span></div><div class="tw"><table><thead><tr><th>Date</th><th class="num">Amount</th><th>Entered by</th></tr></thead><tbody>';if(!rows.length)h+='<tr><td colspan="3" class="muted" style="text-align:center;padding:24px">No usage recorded for this product.</td></tr>';rows.forEach(function(u){h+='<tr><td>'+new Date(u.used_at).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+'</td><td class="num">'+num(u.quantity)+' '+esc(p.unit)+'</td><td>'+esc(nameOf(u.entered_by))+'</td></tr>'});h+='</tbody></table></div></section>';return h}
function viewProducts(){var P=active(),h='';if(!S.isAdmin)h+='<div class="note">Only an administrator can add, import, edit or archive products. Accountants can record usage.</div>';if(S.isAdmin){h+='<section class="panel"><div class="panel-h"><h2>Add a product</h2></div><div class="panel-b"><form id="form-add" class="product-form"><label class="wide">Product name *<input id="f-name" data-bind="name" required autocomplete="off"></label><label>Unit *<input id="f-unit" data-bind="unit" required placeholder="pcs, kg, m"></label><label>Remaining balance *<input id="f-remaining" data-bind="remaining" inputmode="decimal" required placeholder="0"></label><label>Brand name<input id="f-brand" data-bind="brand" autocomplete="off"></label><label class="wide">Description<textarea id="f-description" data-bind="description" rows="2"></textarea></label><button class="btn primary" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Adding…':'Add product')+'</button></form></div></section>';
h+='<section class="panel"><div class="panel-h"><div><h2>Import products</h2><div class="muted">Upload an Excel (.xlsx/.xls) or CSV file to add many products at once.</div></div></div><div class="panel-b"><div class="drop"><input id="import-file" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"><div class="help">Required columns: <strong>Product Name</strong>, <strong>Unit</strong>, <strong>Remaining Balance</strong>. Optional: Brand Name, Description.</div></div>'+(S.importErr?'<div class="err" style="margin-top:10px">'+esc(S.importErr)+'</div>':'')+(S.importRows.length?'<div class="import-preview"><table><thead><tr><th>Product</th><th>Unit</th><th class="num">Remaining</th><th>Brand</th><th>Description</th></tr></thead><tbody>'+S.importRows.slice(0,100).map(function(r){return '<tr><td>'+esc(r.name)+'</td><td>'+esc(r.unit)+'</td><td class="num">'+num(r.remaining)+'</td><td>'+esc(r.brand)+'</td><td>'+esc(r.description)+'</td></tr>'}).join('')+'</tbody></table></div><div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button class="btn primary" data-action="import"'+(S.busy?' disabled':'')+'>'+(S.busy?'Importing…':'Import '+S.importRows.length+' product'+(S.importRows.length===1?'':'s'))+'</button><button class="btn" data-action="clear-import">Clear</button></div>':'')+'</div></section>'}
  h+='<section class="panel"><div class="panel-h"><h2>Warehouse products</h2><span class="muted">'+P.length+' active</span></div><div class="tw"><table style="min-width:900px"><thead><tr><th>Product</th><th>Unit</th><th class="num">Remaining</th><th>Brand</th><th>Description</th><th></th></tr></thead><tbody>';if(!P.length)h+='<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">No products yet.</td></tr>';P.forEach(function(p){if(S.f.editing===p.id){h+='<tr><td colspan="5"><div class="rowedit"><label>Name<input data-bind="e_name" value="'+esc(S.f.e_name||p.name)+'"></label><label>Unit<input data-bind="e_unit" value="'+esc(S.f.e_unit||p.unit)+'"></label><label>Remaining<input data-bind="e_remaining" inputmode="decimal" value="'+esc(S.f.e_remaining!=null?S.f.e_remaining:p.remaining)+'"></label><label>Brand<input data-bind="e_brand" value="'+esc(S.f.e_brand||p.brand)+'"></label><label>Description<input data-bind="e_description" value="'+esc(S.f.e_description!=null?S.f.e_description:p.description)+'"></label></div></td><td style="white-space:nowrap;text-align:right"><button class="btn sm primary" data-action="saveedit">Save</button> <button class="btn sm" data-action="canceledit">Cancel</button></td></tr>'}else h+='<tr><td class="pname">'+esc(p.name)+'</td><td>'+esc(p.unit)+'</td><td class="num">'+num(p.remaining)+'</td><td>'+esc(p.brand||'–')+'</td><td class="desc">'+esc(p.description||'–')+'</td><td style="white-space:nowrap;text-align:right"><button class="btn sm" data-action="edit" data-pid="'+esc(p.id)+'">Edit</button> <button class="btn sm danger" data-action="archive" data-pid="'+esc(p.id)+'">Archive</button></td></tr>'});h+='</tbody></table></div></section>';return h}
function viewLogin(){return '<div class="loginwrap"><form id="form-login" class="panel login"><h1>Warehouse Stock Board</h1><p class="muted">Sign in with the email and password your administrator gave you.</p><label>Email<input id="l-email" type="email" data-bind="email" autocomplete="username" required value="'+esc(S.f.email||'')+'"></label><label>Password<input id="l-pass" type="password" data-bind="password" autocomplete="current-password" required value="'+esc(S.f.password||'')+'"></label>'+(S.loginErr?'<div class="err">'+esc(S.loginErr)+'</div>':'')+'<button class="btn primary" type="submit"'+(S.authBusy?' disabled':'')+'>'+(S.authBusy?'Signing in…':'Sign in')+'</button></form></div>'}
function viewSetup(){return '<div class="loginwrap"><div class="panel login"><h1>Almost ready</h1><p class="muted">Open <code>config.js</code>, paste your Supabase project URL and anon key, save it, and reload this page.</p></div></div>'}
function shell(body){var live=S.ready?(S.live?'<span class="live on">Live</span>':'<span class="live off">Reconnecting</span>'):'';var tabs=[['dash','Dashboard'],['usage','Stock usage'],['products','Products']].map(function(t){return '<button class="tab" data-action="tab" data-v="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'}).join('');var who=S.me?esc(S.me.full_name||'You')+(S.isAdmin?' (admin)':''):'';return '<header class="top"><div class="wrap"><div class="brand"><h1>Warehouse Stock Board</h1><div class="meta">'+live+(who?'<span>'+who+'</span>':'')+'<button class="btn sm" data-action="signout">Sign out</button></div></div><nav class="tabs" aria-label="Sections">'+tabs+'</nav></div></header><main class="wrap">'+body+'</main>'}
function render(){var html;if(!configured())html=viewSetup();else if(!S.authChecked)html='<div class="loginwrap"><p class="muted">Loading…</p></div>';else if(!S.uid)html=viewLogin();else if(S.loadErr)html=shell('<div class="panel empty"><h2>Could not load the stock</h2><p>'+esc(S.loadErr)+'</p><button class="btn primary" data-action="retry">Try again</button></div>');else if(!S.ready)html=shell('<div class="panel empty"><p>Loading warehouse data…</p></div>');else html=shell(S.tab==='usage'?viewUsage():S.tab==='products'?viewProducts():viewDash());$app.innerHTML=html+(S.msg?'<div class="toast">'+esc(S.msg)+'</div>':'')}
async function recordUsage(){var pid=S.f.u_product||S.sel,qty=parseQty(S.f.u_qty);if(!pid||Number.isNaN(qty)||qty<=0){S.usageErr='Enter a positive amount.';render();return}var p=S.products.find(function(x){return x.id===pid});if(!p){S.usageErr='Select a product.';render();return}if(qty>p.remaining){S.usageErr='Amount cannot be greater than the remaining balance ('+num(p.remaining)+' '+p.unit+').';render();return}S.usageBusy=true;S.usageErr='';render();try{var r=await sb.rpc('record_product_usage',{p_product_id:pid,p_quantity:qty});if(r.error)throw r.error;S.f.u_qty='';await loadData();S.sel=pid;S.usageBusy=false;toast('Usage recorded. Remaining balance: '+num(S.products.find(function(x){return x.id===pid}).remaining)+' '+p.unit)}catch(e){S.usageBusy=false;S.usageErr=errText(e);render()}}
function exists(name){return S.products.some(function(p){return p.name.trim().toLowerCase()===name.trim().toLowerCase()})}
function exportCsv(){var rows=[['Product Name','Unit','Remaining Balance','Brand Name','Description']];active().forEach(function(p){rows.push([p.name,p.unit,p.remaining,p.brand,p.description])});var escv=function(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};var text='\ufeff'+rows.map(function(r){return r.map(escv).join(',')}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='warehouse-products-'+ymd(new Date())+'.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},500)}
function normalize(s){return String(s||'').toLowerCase().replace(/[ _-]+/g,'').replace(/\([^)]*\)/g,'')}
function parseImportRows(rows){if(!rows.length)throw new Error('The file is empty.');var keys=Object.keys(rows[0]);function keyOf(names){var n=names.map(normalize);return keys.find(function(k){return n.indexOf(normalize(k))>=0})}var kName=keyOf(['Product Name','Product','Name']),kUnit=keyOf(['Unit']),kRem=keyOf(['Remaining Balance','Remaining','Balance','On Hand']),kBrand=keyOf(['Brand Name','Brand']),kDesc=keyOf(['Description']);if(!kName||!kUnit||!kRem)throw new Error('Missing required columns. Required: Product Name, Unit, Remaining Balance.');return rows.map(function(r,i){var name=String(r[kName]||'').trim(),unit=String(r[kUnit]||'').trim(),remaining=parseQty(r[kRem]);if(!name||!unit||Number.isNaN(remaining))throw new Error('Invalid row '+(i+2)+'. Product Name, Unit and Remaining Balance are required.');return{name:name,unit:unit,remaining:remaining,brand:kBrand?String(r[kBrand]||'').trim():'',description:kDesc?String(r[kDesc]||'').trim():''}}).filter(function(x){return x.name})}
async function handleFile(file){S.importErr='';S.importRows=[];if(!file)return;try{var data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:''});S.importRows=parseImportRows(rows);var seen={};S.importRows=S.importRows.filter(function(r){var k=r.name.toLowerCase();if(seen[k]||exists(r.name))return false;seen[k]=1;return true});if(!S.importRows.length)S.importErr='No new products were found in the file.';render()}catch(e){S.importErr=e.message||'Could not read the file.';render()}}
async function doImport(){if(!S.importRows.length||S.busy)return;S.busy=true;S.importErr='';render();try{var r=await sb.from('products').insert(S.importRows.map(function(x){return{name:x.name,unit:x.unit,remaining_balance:x.remaining,brand:x.brand,description:x.description}}));if(r.error)throw r.error;S.busy=false;S.importRows=[];await loadData();toast('Imported products successfully.')}catch(e){S.busy=false;S.importErr=errText(e);render()}}
async function addProduct(){var f=S.f,name=(f.name||'').trim(),unit=(f.unit||'').trim(),rem=parseQty(f.remaining);if(!name||!unit||Number.isNaN(rem)){toast('Product name, unit and remaining balance are required.');return}if(exists(name)){toast('A product with this name already exists.');return}S.busy=true;render();try{var r=await sb.from('products').insert({name:name,unit:unit,remaining_balance:rem,brand:(f.brand||'').trim(),description:(f.description||'').trim()});if(r.error)throw r.error;S.busy=false;S.f.name='';S.f.unit='';S.f.remaining='';S.f.brand='';S.f.description='';await loadData();toast('Product added.')}catch(e){S.busy=false;toast(errText(e))}}
async function editProduct(id){var p=S.products.find(function(x){return x.id===id}),f=S.f,name=(f.e_name||'').trim(),unit=(f.e_unit||'').trim(),rem=parseQty(f.e_remaining);if(!p||!name||!unit||Number.isNaN(rem)){toast('Name, unit and remaining balance are required.');return}try{var r=await sb.from('products').update({name:name,unit:unit,remaining_balance:rem,brand:(f.e_brand||'').trim(),description:(f.e_description||'').trim()}).eq('id',id);if(r.error)throw r.error;S.f.editing=null;await loadData();toast('Product updated.')}catch(e){toast(errText(e))}}
function act(a,t){switch(a){case'tab':S.tab=t.dataset.v;S.usageErr='';render();break;case'usage-view':S.usageView=t.dataset.v==='daily'?'daily':'monthly';render();break;case'select':S.sel=t.dataset.pid;render();break;case'signout':sb.auth.signOut();break;case'retry':S.loadErr='';onStartSession();break;case'edit':var p=S.products.find(function(x){return x.id===t.dataset.pid});if(p){S.f.editing=p.id;S.f.e_name=p.name;S.f.e_unit=p.unit;S.f.e_remaining=String(p.remaining);S.f.e_brand=p.brand;S.f.e_description=p.description}render();break;case'canceledit':S.f.editing=null;render();break;case'saveedit':editProduct(S.f.editing);break;case'archive':if(confirm('Archive this product? Its usage history will be kept.'))runArchive(t.dataset.pid);break;case'export':exportCsv();break;case'import':doImport();break;case'clear-import':S.importRows=[];S.importErr='';render();break}}
async function runArchive(id){try{var r=await sb.from('products').update({active:false}).eq('id',id);if(r.error)throw r.error;await loadData();toast('Product archived.')}catch(e){toast(errText(e))}}
$app.addEventListener('click',function(e){var t=e.target.closest('[data-action]');if(t)act(t.dataset.action,t)});
$app.addEventListener('change',function(e){var t=e.target;if(t.id==='import-file')handleFile(t.files[0]);if(t.id==='u-product'){S.f.u_product=t.value;S.sel=t.value;render()}});
$app.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.bind)S.f[t.dataset.bind]=t.value});
$app.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.tagName==='TR'&&e.target.dataset.action){e.preventDefault();act(e.target.dataset.action,e.target)}});
$app.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='form-login'){if(S.authBusy)return;S.authBusy=true;S.loginErr='';render();sb.auth.signInWithPassword({email:(S.f.email||'').trim(),password:S.f.password||''}).then(function(r){S.authBusy=false;if(r.error){S.loginErr=/invalid login/i.test(r.error.message)?'Wrong email or password.':errText(r.error);render()}else{S.f.password='';onSession(r.data.user)}});return}if(e.target.id==='form-usage')recordUsage();if(e.target.id==='form-add')addProduct()});
async function onSession(user){S.uid=user.id;S.ready=false;S.loading=true;S.loadErr='';render();try{await loadData();S.ready=true;subscribe()}catch(e){S.loadErr=errText(e)}S.loading=false;render()}
function onStartSession(){sb.auth.getSession().then(function(r){S.authChecked=true;if(r.data&&r.data.session)onSession(r.data.session.user);else render()}).catch(function(){S.authChecked=true;render()})}
function start(){render();if(!configured()||!window.supabase||!window.supabase.createClient){S.authChecked=true;return render()}sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);sb.auth.onAuthStateChange(function(ev,session){if(ev==='SIGNED_OUT'){setTimeout(function(){teardown();render()},0)}else if(session&&session.user&&session.user.id!==S.uid){setTimeout(function(){onSession(session.user)},0)}});onStartSession()}
start();
})();
</script>
</body>
</html>
